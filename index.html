<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>티니핑 이름 맞추기 게임 모음</title>
  <style>
    body { font-family: 'Arial', sans-serif; text-align: center; padding: 10px; background-color: #f0f8ff; margin: 0; }
    
    /* === 메인 컨테이너 === */
    #main-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; min-height: 80vh; position: relative; }
    
    /* === 상단 헤더 (홈 - 제목 - 다음) === */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between; /* 양쪽 끝 정렬 */
      margin-bottom: 10px;
      height: 40px;
    }

    /* 버튼 공통 (홈, 다음) - 크기 작게 통일 */
    .header-btn {
      padding: 6px 12px; 
      font-size: 0.9em; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      color: white;
      white-space: nowrap;
      min-width: 80px; /* 버튼 최소 너비 맞춰서 균형 유지 */
    }

    #home-btn { background: #ff9800; }
    #home-btn:hover { background: #e68900; }

    #next-btn { 
      background: #673AB7; 
      display: none; /* 처음엔 숨김 */
    }
    #next-btn:hover { background: #5e35b1; }

    /* 제목 스타일 */
    #game-title {
      font-size: 1.5em;
      color: #333;
      margin: 0;
      flex-grow: 1; /* 중간 공간 차지 */
      text-align: center;
    }
    
    /* 빈 공간 채우기용 (다음 버튼 없을 때 제목 중앙 유지) */
    .placeholder-btn { min-width: 80px; visibility: hidden; }

    /* === 시작 화면 === */
    #start-screen { padding: 40px 0; }
    h1 { margin-top: 0; font-size: 1.8em; color: #333; }
    .mode-btn {
      display: block; width: 90%; margin: 20px auto; padding: 20px;
      font-size: 1.2em; font-weight: bold; color: white;
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform 0.2s;
    }
    .mode-btn.syllable { background: #4CAF50; }
    .mode-btn.choice { background: #2196F3; }
    .mode-btn:hover { transform: scale(1.03); opacity: 0.9; }
    .mode-desc { font-size: 0.9em; color: #eee; margin-top: 5px; font-weight: normal; }

    /* === 게임 영역 === */
    #game-area { display: none; }

    /* 이미지/비디오 */
    #character-img {
      width: 100%; max-height: 300px; object-fit: contain;
      border: 2px solid #ddd; border-radius: 10px; margin-bottom: 5px;
      cursor: pointer;
    }
    #character-video {
      width: 100%; border: 2px solid #ddd; border-radius: 10px; display: none; margin-bottom: 10px;
    }

    /* 텍스트 */
    #message { height: 24px; color: #e91e63; font-weight: bold; margin: 10px 0; font-size: 1.2em; }
    #answer-display { font-size: 1.6em; font-weight: bold; margin: 5px 0; color: #333; }
    .hint-text { font-size: 0.9em; color: #888; margin-bottom: 5px; min-height: 1.2em; }

    /* 보기 버튼 */
    .choice-btn {
      background: #f9f9f9; border: 2px solid #ddd; border-radius: 8px;
      padding: 15px; 
      font-size: 1.8em;
      cursor: pointer; margin: 5px;
      touch-action: manipulation;
      word-break: keep-all;
    }
    .choice-btn:hover { background: #eef; border-color: #bce; }
    .choice-btn:active { background: #dde; }

    #syllable-container button { min-width: 60px; }
    #choice-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="main-container">
    
    <div id="start-screen">
      <h1>티니핑 이름 맞추기</h1>
      <p>게임을 선택해주세요!</p>
      
      <button class="mode-btn syllable" onclick="startGame('syllable')">
        1. 글자 맞추기
        <div class="mode-desc">한 글자씩 이름을 맞춰보세요!</div>
      </button>

      <button class="mode-btn choice" onclick="startGame('choice')">
        2. 객관식 맞추기
        <div class="mode-desc">4개 이름 중 정답을 골라보세요!</div>
      </button>
    </div>

    <div id="game-area">
      
      <div class="game-header">
        <button id="home-btn" class="header-btn" onclick="goHome()">🏠 홈으로</button>
        <h2 id="game-title">게임 제목</h2>
        <button id="next-btn" class="header-btn">다음 문제 ▶</button>
        <div id="next-placeholder" class="placeholder-btn"></div>
      </div>
      
      <div style="position: relative;">
        <img id="character-img" src="" alt="캐릭터">
        <video id="character-video" playsinline loop controls></video>
        <div id="hint-msg" class="hint-text"></div>
      </div>

      <div id="answer-display"></div>
      
      <div id="message"></div>

      <div id="syllable-container" style="display:none;">
        <div id="syllable-choices1"></div>
        <div id="syllable-choices2" style="display:none; margin-top:10px;"></div>
      </div>

      <div id="choice-grid" style="display:none;"></div>

    </div>
  </div>

  <script>
    // ====== 1. TTS 기능 ======
    let sunhiVoice = null;
    function initTTS() {
      const voices = speechSynthesis.getVoices();
      sunhiVoice = voices.find(v => v.lang === 'ko-KR' && v.name.includes('SunHi'));
    }
    speechSynthesis.onvoiceschanged = initTTS;
    initTTS();

    function speak(text) {
      if (!text) return;
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.9; 
      if (sunhiVoice) utter.voice = sunhiVoice;
      speechSynthesis.speak(utter);
    }

    // ====== 2. 데이터 ======
    const characters = [
      { name: '아휴핑', img: 'ahyuping.png', video: 'ahyuping.mp4' },
      { name: '아자핑', img: 'ajaping.png', video: 'ajaping.mp4' },
      { name: '앙대핑', img: 'angdaeping.png', video: 'angdaeping.mp4' },
      { name: '아잉핑', img: 'ayingping.png', video: 'ayingping.mp4' },
      { name: '발레핑', img: 'balleping.png', video: 'balleping.mp4' },
      { name: '바네핑', img: 'baneping.png', video: 'baneping.mp4' },
      { name: '빤짝핑', img: 'banjakping.jpeg', video: 'banjakping.mp4' },
      { name: '바로핑', img: 'baroping.jpeg', video: 'baroping.mp4' },
      { name: '베베핑', img: 'bebeping.png', video: 'bebeping.mp4' },
      { name: '빙글핑', img: 'binggeulping.png', video: 'binggeulping.mp4' },
      { name: '빛나핑', img: 'bitnaping.jpeg', video: 'bitnaping.mp4' },
      { name: '부끄핑', img: 'bukkeuping.png', video: 'bukkeuping.mp4' },
      { name: '차차핑', img: 'chachaping.png', video: 'chachaping.mp4' },
      { name: '차캐핑', img: 'chakyaeping.png', video: 'chakyaeping.mp4' },
      { name: '달콤핑', img: 'dalkomping.png', video: 'dalkomping.mp4' },
      { name: '덜덜핑', img: 'deoldeolping.png', video: 'deoldeolping.mp4' },
      { name: '딩동핑', img: 'dingdongping.png', video: 'dingdongping.mp4' },
      { name: '가면핑', img: 'gamyunping.png', video: 'gamyunping.mp4' },
      { name: '간호핑', img: 'ganhoping.png', video: 'ganhoping.mp4' },
      { name: '그림핑', img: 'geurimping.png', video: 'geurimping.mp4' },
      { name: '고마핑', img: 'gomaping.png', video: 'gomaping.mp4' },
      { name: '공쥬핑', img: 'gongjyuping.png', video: 'gongjyuping.mp4' },
      { name: '하츄핑', img: 'hachuupping.jpeg', video: 'hachuupping.mp4' },
      { name: '함께핑', img: 'hamkkaeping.png', video: 'hamkkaeping.mp4' },
      { name: '핫케핑', img: 'hatkeping.png', video: 'hatkeping.mp4' },
      { name: '힘내핑', img: 'himnaeping.png', video: 'himnaeping.mp4' },
      { name: '화나핑', img: 'hwanaping.png', video: 'hwanaping.mp4' },
      { name: '짝짝핑', img: 'jjakjjakping.png', video: 'jjakjjakping.mp4' },
      { name: '찌릿핑', img: 'jjiritping.png', video: 'jjiritping.mp4' },
      { name: '쪼꼼핑', img: 'jjokkomping.png', video: 'jjokkomping.mp4' },
      { name: '쪼꼬핑', img: 'jjokkoping.png', video: 'jjokkoping.mp4' },
      { name: '주네핑', img: 'juneping.png', video: 'juneping.mp4' },
      { name: '깜빡핑', img: 'kkambbakping.png', video: 'kkambbakping.mp4' },
      { name: '깡총핑', img: 'kkangchongping.png', video: 'kkangchongping.mp4' },
      { name: '까르핑', img: 'kkareuping.png', video: 'kkareuping.mp4' },
      { name: '꺼꿀핑', img: 'kkeokkulping.png', video: 'kkeokkulping.mp4' },
      { name: '꾸래핑', img: 'kkuraeping.png', video: 'kkuraeping.mp4' },
      { name: '마카핑', img: 'makaping.png', video: 'makaping.mp4' },
      { name: '말랑핑', img: 'mallangping.png', video: 'mallangping.mp4' },
      { name: '맛나핑', img: 'matnaping.png', video: 'matnaping.mp4' },
      { name: '멜로핑', img: 'melloping.jpeg', video: 'melloping.mp4' },
      { name: '메모핑', img: 'memoping.png', video: 'memoping.mp4' },
      { name: '믿어핑', img: 'mideoping.png', video: 'mideoping.mp4' },
      { name: '모야핑', img: 'moyaping.png', video: 'moyaping.mp4' },
      { name: '무거핑', img: 'mugeoping.png', video: 'mugeoping.mp4' },
      { name: '나나핑', img: 'nanaping.png', video: 'nanaping.mp4' },
      { name: '나눔핑', img: 'nanumping.png', video: 'nanumping.mp4' },
      { name: '나르핑', img: 'nareuping.png', video: 'nareuping.mp4' },
      { name: '노라핑', img: 'noraping.png', video: 'noraping.mp4' },
      { name: '눈꽃핑', img: 'nunkkotping.png', video: 'nunkkotping.mp4' },
      { name: '패션핑', img: 'paesyonping.png', video: 'paesyonping.mp4' },
      { name: '포실핑', img: 'posilping.png', video: 'posilping.mp4' },
      { name: '삐짐핑', img: 'ppijimping.png', video: 'ppijimping.mp4' },
      { name: '뿌뿌핑', img: 'ppuppuping.png', video: 'ppuppuping.mp4' },
      { name: '솔찌핑', img: 'soljjiping.png', video: 'soljjiping.mp4' },
      { name: '소원핑', img: 'sowonping.png', video: 'sowonping.mp4' },
      { name: '씽씽핑', img: 'ssingssingping.png', video: 'ssingssingping.mp4' },
      { name: '샤샤핑', img: 'syasyaping.png', video: 'syasyaping.mp4' },
      { name: '트러핑', img: 'teureoping.jpeg', video: 'teureoping.mp4' },
      { name: '토이핑', img: 'toiping.png', video: 'toiping.mp4' },
      { name: '딱풀핑', img: 'ttakpulping.png', video: 'ttakpulping.mp4' },
      { name: '따라핑', img: 'ttaraping.png', video: 'ttaraping.mp4' },
      { name: '뚝딱핑', img: 'ttukttakping.png', video: 'ttukttakping.mp4' },
      { name: '투투핑', img: 'tutuping.png', video: 'tutuping.mp4' },
      { name: '얌얌핑', img: 'yamyamping.png', video: 'yamyamping.mp4' },
      { name: '요거핑', img: 'yogeoping.png', video: 'yogeoping.mp4' }
    ];

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ====== 3. 전역 상태 ======
    let currentMode = ''; 
    let questionList = [];
    let currentIndex = 0;
    
    let selectedFirst = null;
    let selectedSecond = null;

    // ====== 4. 화면 제어 ======
    function goHome() {
      const v = document.getElementById('character-video');
      v.pause();
      v.src = "";
      v.style.display = 'none';

      document.getElementById('start-screen').style.display = 'block';
      document.getElementById('game-area').style.display = 'none';
    }

    function startGame(mode) {
      currentMode = mode;
      currentIndex = 0;
      questionList = shuffle([...characters]);

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';

      // 모드별 화면 세팅
      if (mode === 'syllable') {
        document.getElementById('game-title').textContent = "글자 맞추기";
        document.getElementById('syllable-container').style.display = 'block';
        document.getElementById('choice-grid').style.display = 'none';
        document.getElementById('hint-msg').style.display = 'none'; 
      } else {
        document.getElementById('game-title').textContent = "객관식 맞추기";
        document.getElementById('syllable-container').style.display = 'none';
        document.getElementById('choice-grid').style.display = 'grid';
        document.getElementById('hint-msg').style.display = 'block'; 
        document.getElementById('hint-msg').textContent = "👆 사진을 누르면 이름을 들려줘요";
      }

      loadQuestion();
    }

    // ====== 5. 문제 로드 ======
    function loadQuestion() {
      const current = questionList[currentIndex];
      const imgEl = document.getElementById('character-img');
      const videoEl = document.getElementById('character-video');
      const msgEl = document.getElementById('message');
      const hintMsg = document.getElementById('hint-msg');
      
      const nextBtn = document.getElementById('next-btn');
      const placeholder = document.getElementById('next-placeholder');

      // 초기화
      msgEl.textContent = '';
      
      // 다음 버튼 숨기고, 공간 차지용 div 보이기 (제목 중앙 유지)
      nextBtn.style.display = 'none';
      placeholder.style.display = 'block';
      
      try { videoEl.pause(); } catch(e){}
      videoEl.style.display = 'none';
      videoEl.src = "";
      
      imgEl.style.display = 'block';
      imgEl.src = current.img;

      if (currentMode === 'choice') {
        hintMsg.style.display = 'block';
      } else {
        hintMsg.style.display = 'none';
      }

      // 이미지 클릭 (객관식 모드 힌트)
      imgEl.onclick = () => {
        if (currentMode === 'choice') {
           speak(current.name);
        }
      };

      if (currentMode === 'syllable') {
        setupSyllableGame(current);
      } else {
        setupChoiceGame(current);
      }
    }

    // ====== 6. [모드 1] 글자 맞추기 ======
    function setupSyllableGame(current) {
      const answerDisplay = document.getElementById('answer-display');
      answerDisplay.innerHTML = "정답: OO핑";
      
      selectedFirst = null;
      selectedSecond = null;
      
      document.getElementById('syllable-choices1').style.display = 'block';
      document.getElementById('syllable-choices2').style.display = 'none';

      const correctFirst = [...current.name][0];
      const allFirsts = [...new Set(characters.map(c => [...c.name][0]))];
      let firstOpts = allFirsts.filter(s => s !== correctFirst);
      firstOpts = shuffle(firstOpts).slice(0, 3);
      firstOpts.push(correctFirst);
      firstOpts = shuffle(firstOpts);

      const c1 = document.getElementById('syllable-choices1');
      c1.innerHTML = '';
      firstOpts.forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch;
        btn.className = 'choice-btn';
        btn.onclick = () => {
          speak(ch);
          if (ch === correctFirst) {
            selectedFirst = ch;
            answerDisplay.innerHTML = `정답: ${ch}O핑`;
            c1.style.display = 'none';
            setupSyllableSecond(current);
            document.getElementById('message').textContent = "";
          } else {
            document.getElementById('message').textContent = "틀렸습니다. 다시 해보세요!";
          }
        };
        c1.appendChild(btn);
      });
    }

    function setupSyllableSecond(current) {
      const correctSecond = [...current.name][1];
      const allSeconds = [...new Set(characters.map(c => [...c.name][1]))];
      let secondOpts = allSeconds.filter(s => s !== correctSecond);
      secondOpts = shuffle(secondOpts).slice(0, 3);
      secondOpts.push(correctSecond);
      secondOpts = shuffle(secondOpts);

      const c2 = document.getElementById('syllable-choices2');
      c2.style.display = 'block';
      c2.innerHTML = '';
      
      secondOpts.forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch;
        btn.className = 'choice-btn';
        btn.onclick = () => {
          speak(ch);
          if (ch === correctSecond) {
            selectedSecond = ch;
            handleCorrect(current);
          } else {
            document.getElementById('message').textContent = "틀렸습니다. 다시 해보세요!";
          }
        };
        c2.appendChild(btn);
      });
    }

    // ====== 7. [모드 2] 객관식 ======
    function setupChoiceGame(current) {
      const answerDisplay = document.getElementById('answer-display');
      answerDisplay.textContent = "누구일까요?";

      const grid = document.getElementById('choice-grid');
      grid.style.display = 'grid'; 
      grid.innerHTML = '';

      const others = characters.filter(c => c.name !== current.name);
      const wrongs = shuffle(others).slice(0, 3);
      let choices = shuffle([...wrongs, current]);

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.textContent = choice.name;
        btn.className = 'choice-btn';
        btn.onclick = () => {
          if (choice.name === current.name) {
             handleCorrect(current);
          } else {
             speak(choice.name);
             document.getElementById('message').textContent = `땡! 다시 찾아봐!`;
          }
        };
        grid.appendChild(btn);
      });
    }

    // ====== 8. 정답 처리 ======
    function handleCorrect(current) {
      const msgEl = document.getElementById('message');
      const answerDisplay = document.getElementById('answer-display');
      const imgEl = document.getElementById('character-img');
      const videoEl = document.getElementById('character-video');
      const hintMsg = document.getElementById('hint-msg');
      
      const nextBtn = document.getElementById('next-btn');
      const placeholder = document.getElementById('next-placeholder');

      msgEl.textContent = "정답입니다! 짝짝짝!";
      answerDisplay.textContent = `정답: ${current.name}`;
      
      speak(current.name);

      document.getElementById('syllable-choices2').style.display = 'none';
      document.getElementById('choice-grid').style.display = 'none';

      if (current.video) {
        imgEl.style.display = 'none';
        hintMsg.style.display = 'none'; 
        videoEl.src = current.video;
        videoEl.style.display = 'block';
        videoEl.muted = false;
        videoEl.play().catch(e => console.log('Auto-play blocked', e));
      }

      // 다음 버튼 헤더에 표시
      placeholder.style.display = 'none'; // 공간차지 div 숨김
      nextBtn.style.display = 'block';    // 진짜 버튼 보임
      
      nextBtn.onclick = () => {
        currentIndex++;
        if (currentIndex < questionList.length) {
          loadQuestion();
        } else {
          document.getElementById('game-area').innerHTML = `
            <h2>🎉 모든 문제를 다 맞췄어요!</h2>
            <button class="header-btn" style="background:#4CAF50; font-size:1.2em;" onclick="goHome()">홈으로 돌아가기</button>
          `;
        }
      };
    }
  </script>
</body>
</html>
